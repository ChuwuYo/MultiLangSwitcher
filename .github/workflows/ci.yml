name: CI

on:
  push:
    branches: [main, master, refactor/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: node scripts/check-syntax.mjs
      - run: node scripts/validate-manifest.mjs
      - run: npm test
