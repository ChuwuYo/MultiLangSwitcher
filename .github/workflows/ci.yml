name: CI

on:
  push:
    branches: [main, master, refactor/**]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: node scripts/check-syntax.mjs
      - run: node scripts/validate-manifest.mjs
      - run: npm test

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension zip
        run: |
          VERSION=$(jq -r .version manifest.json)
          zip -r "MultiLangSwitcher-v${VERSION}.zip" \
            manifest.json LICENSE \
            background.js popup.html popup.js \
            debug.html debug-ui.js debug-headers.js \
            detect.html detect.js detect-ai.js \
            toggle.js toggle.css \
            domain-rules-manager.js domain-rules.json \
            bootstrap.min.css \
            _locales shared i18n images fonts \
            -x "shared/vendor/*.map"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: MultiLangSwitcher-v*.zip
          retention-days: 30

  prerelease:
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
      - name: Rename zip with commit sha
        run: |
          VERSION=$(jq -r .version manifest.json)
          mv "MultiLangSwitcher-v${VERSION}.zip" "MultiLangSwitcher-v${VERSION}-dev.${GITHUB_SHA::7}.zip"
      - name: Move latest tag to HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (continuous)
          prerelease: true
          files: MultiLangSwitcher-v*-dev.*.zip
          generate_release_notes: true

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard tag/version match
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(jq -r .version manifest.json)
          test "$TAG" = "$VERSION" || { echo "tag $TAG != manifest version $VERSION"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
      - uses: softprops/action-gh-release@v2
        with:
          files: MultiLangSwitcher-v*.zip
          generate_release_notes: true
