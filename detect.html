<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <!-- 字体预加载 -->
  <link rel="preload" href="fonts/MapleMonoNL-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link href="bootstrap.purged.css" rel="stylesheet">
  <link href="shared/page-base.css" rel="stylesheet">
  <link href="fonts/MapleMonoNL-Regular.woff2" rel="stylesheet">
  <link href="toggle.css" rel="stylesheet">
  <link href="shared/copy-button.css" rel="stylesheet">
  <script src="shared/theme-init.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .header-info {
      margin-top: 20px;
    }

    pre {
      background-color: var(--bs-tertiary-bg);
      padding: 15px;
      border-radius: 5px;
    }

    .list-group-item-success .badge {
      background-color: #28a745;
      color: white;
    }

    .list-group-item-danger .badge {
      background-color: #dc3545;
      color: white;
    }

    .ai-diagnosis-card {
      border: 1px solid rgba(13, 110, 253, 0.2);
      box-shadow: 0 10px 30px rgba(13, 110, 253, 0.08);
    }


    .ai-config-details summary {
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }

    .ai-config-details[open] summary {
      margin-bottom: 12px;
    }

    .ai-config-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .ai-provider-row {
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
      margin-bottom: 12px;
    }

    .ai-provider-description {
      min-height: 20px;
    }

    .ai-config-hint {
      min-height: 20px;
    }

    .ai-chat-messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 160px;
      max-height: 480px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid var(--bs-border-color);
      border-radius: 10px;
      background: rgba(248, 249, 250, 0.8);
    }

    html[data-bs-theme="dark"] .ai-chat-messages {
      background: rgba(33, 37, 41, 0.65);
    }

    .ai-chat-message {
      position: relative;
      max-width: 100%;
      padding: 12px 48px 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      word-break: break-word;
    }

    .ai-chat-message-content {
      white-space: pre-wrap;
    }

    .ai-chat-message-user {
      align-self: flex-end;
      background: rgba(13, 110, 253, 0.12);
      border-color: rgba(13, 110, 253, 0.2);
    }

    .ai-chat-message-assistant {
      align-self: stretch;
      background: rgba(25, 135, 84, 0.08);
      border-color: rgba(25, 135, 84, 0.18);
    }

    .ai-chat-message pre,
    .ai-chat-message code {
      font-family: 'MapleMonoNL', monospace;
    }

    .ai-chat-message p:last-child,
    .ai-chat-message ul:last-child,
    .ai-chat-message ol:last-child,
    .ai-chat-message pre:last-child {
      margin-bottom: 0;
    }

    .ai-chat-composer {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ai-chat-composer-main {
      flex: 1 1 420px;
    }

    .ai-chat-composer textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
    }

    .ai-chat-composer-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 0 0 170px;
    }

    .ai-chat-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>

<body>
  <button id="themeToggleBtn" class="toggle" title="Toggle Theme" data-i18n-title="theme_toggle"></button>

  <div class="container">
    <h2 id="pageHeading" data-i18n="heading"></h2>
    <p class="lead" id="pageSubtitle" data-i18n="subtitle"></p>

    <div class="alert alert-info">
      <strong id="tipLabel"></strong> <span id="tipText"></span>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="card mb-3 ai-diagnosis-card">
          <div class="card-header bg-body-tertiary">
            <h4 class="mb-1" id="aiDiagnosisTitle" data-i18n="ai_diagnosis_title"></h4>
            <p class="mb-0 small text-muted" id="aiDiagnosisSubtitle"></p>
          </div>
          <div class="card-body">
            <details class="ai-config-details mb-3" id="aiConfigDetails" open>
              <summary id="aiConfigSummary" data-i18n="ai_config_summary"></summary>

              <div class="ai-provider-row mt-3">
                <div>
                  <label class="form-label" for="aiProviderSelect" id="aiProviderLabel" data-i18n="ai_provider_label"></label>
                  <select class="form-select" id="aiProviderSelect"></select>
                </div>
                <div class="d-flex flex-column justify-content-end">
                  <p class="small text-muted mb-0 ai-provider-description" id="aiProviderDescription"></p>
                </div>
              </div>

              <div class="ai-config-grid">
                <div>
                  <label class="form-label" for="aiBaseUrlInput" id="aiBaseUrlLabel" data-i18n="ai_base_url_label"></label>
                  <input class="form-control" type="url" id="aiBaseUrlInput" autocomplete="off">
                </div>
                <div>
                  <label class="form-label" for="aiModelInput" id="aiModelLabel" data-i18n="ai_model_label"></label>
                  <input class="form-control" type="text" id="aiModelInput" autocomplete="off">
                </div>
                <div>
                  <label class="form-label" for="aiApiKeyInput" id="aiApiKeyLabel" data-i18n="ai_api_key_label"></label>
                  <div class="input-group">
                    <input class="form-control" type="password" id="aiApiKeyInput" autocomplete="off">
                    <button class="btn btn-outline-secondary" type="button" id="aiApiKeyToggle" data-i18n="ai_api_key_toggle_show"></button>
                  </div>
                </div>
              </div>

              <p class="small text-muted mt-3 mb-1" id="aiPrivacyHint" data-i18n="ai_privacy_hint"></p>
              <p class="small mb-0 ai-config-hint" id="aiConfigHint"></p>
            </details>

            <div class="ai-chat-actions mb-3">
              <button class="btn btn-primary" type="button" id="aiStartButton" data-i18n="ai_start"></button>
              <button class="btn btn-outline-danger" type="button" id="aiStopButton" data-i18n="ai_stop" disabled></button>
              <button class="btn btn-outline-secondary" type="button" id="aiClearButton" data-i18n="ai_clear"></button>
              <button class="btn btn-outline-secondary" type="button" id="aiExportStructuredButton" data-i18n="ai_export_structured"></button>
            </div>

            <div class="ai-chat-messages mb-3" id="aiChatMessages"></div>
            <div class="small text-muted mb-3" id="aiChatStatus" aria-live="polite" role="status"></div>

            <div class="ai-chat-composer">
              <div class="ai-chat-composer-main">
                <label class="visually-hidden" for="aiUserInput" id="aiUserInputLabel" data-i18n="ai_user_input_label"></label>
                <textarea class="form-control" id="aiUserInput" data-i18n-placeholder="ai_user_input_placeholder"></textarea>
              </div>
              <div class="ai-chat-composer-actions">
                <button class="btn btn-success" type="button" id="aiSendButton" data-i18n="ai_send"></button>
                <button class="btn btn-outline-secondary" type="button" id="aiExportButton" data-i18n="ai_export"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-header bg-body-tertiary" id="requestHeaderTitle" data-i18n="request_header"></div>
          <div class="card-body">
            <div id="headerLanguageInfo" data-i18n="detecting"></div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-header bg-body-tertiary" id="jsLanguageTitle" data-i18n="js_language"></div>
          <div class="card-body">
            <div id="jsLanguageInfo" data-i18n="detecting"></div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-header bg-body-tertiary" id="intlApiTitle" data-i18n="intl_api"></div>
          <div class="card-body">
            <div id="intlApiInfo" data-i18n="detecting"></div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-header bg-body-tertiary" id="webRtcTitle" data-i18n="webrtc_detection"></div>
          <div class="card-body">
            <div id="webRtcInfo" data-i18n="detecting"></div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-header bg-body-tertiary" id="browserFingerprintTitle" data-i18n="browser_fingerprint"></div>
          <div class="card-body">
            <div id="fingerprintInfo" data-i18n="detecting"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 兼容性检查 -->
    <div class="row">
      <div class="col-md-12">
        <div class="card mb-3">
          <div class="card-header bg-body-tertiary" id="browserCompatibilityTitle" data-i18n="browser_compatibility"></div>
          <div class="card-body">
            <p><strong id="browserInfoLabel" data-i18n="browser_info"></strong> <span id="browserInfoDisplay" data-i18n="detecting"></span></p>
            <h5 id="apiSupportTitle" data-i18n="api_support"></h5>
            <ul id="apiCompatibilityList" class="list-group">
              <!-- JS will populate API compatibility info here -->
              <li class="list-group-item" id="detectingItem" data-i18n="detecting"></li>
            </ul>
          </div>
        </div>
      </div>
    </div>


    <div class="row">
      <div class="col-md-12">
        <div class="card mb-3">
          <div class="card-header bg-body-tertiary" id="hardwareFingerprintTitle" data-i18n="hardware_fingerprint"></div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <div class="card h-100">
                  <div class="card-header bg-body-tertiary" id="canvasFingerprintTitle" data-i18n="canvas_fingerprint"></div>
                  <div class="card-body">
                    <div id="canvasFingerprintInfo" data-i18n="detecting"></div>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card h-100">
                  <div class="card-header bg-body-tertiary" id="webglFingerprintTitle" data-i18n="webgl_fingerprint"></div>
                  <div class="card-body">
                    <div id="webglFingerprintInfo" data-i18n="detecting"></div>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card h-100">
                  <div class="card-header bg-body-tertiary" id="audioFingerprintTitle" data-i18n="audio_fingerprint"></div>
                  <div class="card-body">
                    <div id="audioFingerprintInfo" data-i18n="detecting"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="header-info mt-4">
      <h4 id="completeHeadersTitle" data-i18n="complete_headers"></h4>
      <pre id="headerInfo" data-i18n="loading"></pre>
    </div>
  </div>

  <!-- vendor 经典脚本保留，模块入口统一为 detect-ai.js -->
  <script src="shared/vendor/marked.umd.min.js"></script>
  <script src="shared/vendor/purify.min.js"></script>
  <script type="module" src="detect-ai.js"></script>
</body>

</html>
