<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <!-- 字体预加载 -->
  <link rel="preload" href="fonts/MapleMonoNL-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link href="bootstrap.min.css" rel="stylesheet">
  <link href="fonts/MapleMonoNL-Regular.woff2" rel="stylesheet">
  <link href="toggle.css" rel="stylesheet">
  <script src="shared/theme-init.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .debug-section {
      position: relative;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 5px;
      background-color: #f8f9fa;
    }

    /* 确保所有卡片间距一致 */
    .col-md-6 .debug-section {
      margin-bottom: 20px;
    }

    .debug-result {
      margin-top: 10px;
      padding: 15px;
      border-radius: 5px;
      background-color: #fff;
      border: 1px solid #dee2e6;
      min-height: 60px;
      height: auto;
      max-height: 400px;
      overflow-y: auto;
      overflow-wrap: break-word;
      white-space: normal;
      font-size: 0.9em;
      line-height: 1.5;
      box-sizing: border-box;
      display: block;
      width: 100%;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: rgb(240, 101, 101);
      font-weight: bold;
    }

    /* 日志不同类型的颜色 */
    .log-info {
      color: rgb(165, 165, 250);
    }

    .log-warning {
      color: orange;
    }

    .log-error {
      color: rgb(248, 115, 115);
    }

    .log-success {
      color: green;
    }

    @font-face {
      font-family: 'MapleMonoNL';
      src: url('fonts/MapleMonoNL-Regular.woff2') format('woff2');
    }

    body {
      font-family: 'MapleMonoNL', sans-serif;
    }

    /* 匹配规则详情的样式 */
    .matched-rule-detail {
      margin-left: 15px;
      border-left: 2px solid #007bff;
      padding-left: 10px;
      margin-bottom: 5px;
    }

    .reset-btn-corner {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    /* 缓存管理样式 */
    .cache-stats-container {
      background-color: #fff;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      padding: 10px;
      font-size: 0.9em;
    }

    .cache-stat-item {
      padding: 5px 0;
    }

    .cache-size {
      font-weight: bold;
      color: #0d6efd;
    }

    .cache-hit-rate {
      font-size: 0.8em;
      color: #6c757d;
    }


    /* 暗色主题下的缓存管理样式 */
    html[data-bs-theme="dark"] .cache-stats-container {
      background-color: #2c3034;
      border-color: #495057;
      color: #f8f9fa;
    }

    html[data-bs-theme="dark"] .cache-size {
      color: #86b7fe;
    }

    html[data-bs-theme="dark"] .cache-hit-rate {
      color: #adb5bd;
    }

    /* 缓存操作结果显示框样式 */
    #cacheOperationResult {
      margin-top: 10px;
      padding: 8px 10px;
      /* 减少上下内边距 */
      border-radius: 5px;
      background-color: #fff;
      border: 1px solid #dee2e6;
      min-height: 2.2em;
      /* 最小高度约一行 */
      max-height: 400px;
      /* 增加最大高度限制 */
      overflow-y: auto;
      /* 内容超出时显示滚动条 */
      word-break: break-word;
      white-space: normal;
      /* 允许正常换行 */
      font-size: 0.9em;
      line-height: 1.4;
    }

    /* 暗色主题下的缓存操作结果样式 */
    html[data-bs-theme="dark"] #cacheOperationResult {
      background-color: #2c3034;
      border-color: #495057;
      color: #f8f9fa;
    }
  </style>
</head>

<body>
  <button id="themeToggleBtn" class="toggle" title="Toggle Theme" data-i18n-title="theme_toggle"></button>

  <div class="container">
    <h2 id="pageHeading" data-i18n="heading"></h2>
    <p class="lead" id="pageSubtitle" data-i18n="subtitle"></p>

    <div class="alert alert-info">
      <strong id="tipLabel" data-i18n="tip_label"></strong> <span id="tipText" data-i18n="tip"></span>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="debug-section">
          <h4 id="currentRulesTitle" data-i18n="current_rules"></h4>
          <p class="text-muted" id="currentRulesDesc" data-i18n="current_rules_desc"></p>
          <button id="showRulesBtn" class="btn btn-primary" data-i18n="show_rules"></button>
          <div id="rulesResult" class="debug-result" data-i18n="click_view_rules"></div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="debug-section">
          <h4 id="headerTestTitle" data-i18n="header_test"></h4>
          <p class="text-muted" id="headerTestDesc" data-i18n="header_test_desc"></p>
          <div class="mb-3">
            <label for="testLanguage" class="form-label" id="testLanguageLabel" data-i18n="test_language_label"></label>
            <select class="form-select" id="testLanguage">
              <!-- 语言选项将由JavaScript动态生成 -->
            </select>
          </div>
          <button id="testHeaderBtn" class="btn btn-success" data-i18n="test_header"></button>
          <div id="headerTestResult" class="debug-result" data-i18n="click_test_header"></div>
        </div>
      </div>

      <!-- 自定义语言设置 -->
      <div class="col-md-6">
        <div class="debug-section">
          <button id="resetCustomLangBtn" class="toggle reset-btn-corner"
            data-i18n-title="reset_accept_language_tooltip"><img src="images/reset.svg" id="resetBtnImg" width="16"
              height="16" class="invert-on-dark" data-i18n-alt="reset_accept_language_tooltip"></button>
          <h4 id="customLangTitle" data-i18n="custom_language"></h4>
          <p class="text-muted" id="customLangDesc" data-i18n="custom_language_desc"></p>
          <div class="mb-3">
            <label for="customLanguageInput" class="form-label" id="customLangInputLabel"
              data-i18n="custom_language_label"></label>
            <input type="text" class="form-control" id="customLanguageInput"
              data-i18n-placeholder="custom_language_placeholder">
          </div>
          <button id="applyCustomLangBtn" class="btn btn-primary" data-i18n="apply_custom"></button>
          <div id="customLangResult" class="debug-result mt-2"></div>
        </div>
      </div>
      <!-- 自定义语言设置结束 -->

      <!-- Accept-Language 格式说明卡片 -->
      <div class="col-md-6">
        <div class="debug-section">
          <h4 id="formatExplanationTitle" data-i18n="format_explanation"></h4>
          <p class="text-muted" id="formatExplanationDesc" data-i18n="format_explanation_desc"></p>
          <p><strong id="basicFormatTitle" data-i18n="basic_format"></strong></p>
          <ul id="formatList">
            <li id="languageCodeItem"></li>
            <li id="regionCodeItem"></li>
            <li id="qualityValueItem"></li>
          </ul>
          <p><strong id="examplesTitle" data-i18n="examples"></strong></p>
          <ul id="examplesList">
            <li id="exampleComplex"></li>
          </ul>
          <p class="small text-muted" id="formatNote" data-i18n="format_note"></p>
        </div>
      </div>
      <!-- Accept-Language 格式说明卡片结束 -->

      <!-- 域名匹配缓存管理卡片 -->
      <div class="col-md-6">
        <div class="debug-section">
          <h4 id="cacheManagementTitle"></h4>
          <p class="text-muted" id="cacheManagementDesc"></p>

          <!-- 缓存统计显示 -->
          <div class="mb-3">
            <h6 id="cacheStatsTitle"></h6>
            <div id="cacheStatsDisplay" class="cache-stats-container">
              <div class="row g-2">
                <div class="col-6">
                  <div class="cache-stat-item">
                    <small class="text-muted" id="domainCacheLabel"></small>
                    <div class="d-flex align-items-center">
                      <span id="domainCacheSize" class="cache-size">-</span>
                      <span class="cache-hit-rate ms-2" id="domainCacheHitRate">(-)</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 缓存测试 -->
          <div class="mb-3">
            <label for="testDomainInput" class="form-label" id="testDomainLabel"></label>
            <div class="input-group">
              <input type="text" class="form-control form-control-sm" id="testDomainInput" placeholder="example.com">
              <button id="testDomainBtn" class="btn btn-outline-success btn-sm"></button>
            </div>
          </div>

          <!-- 缓存管理按钮 -->
          <div class="mb-3">
            <div class="d-grid gap-2">
              <div class="row g-2">
                <div class="col-12">
                  <button id="refreshCacheStatsBtn" class="btn btn-info btn-sm w-100"></button>
                </div>
              </div>
              <div class="row g-2">
                <div class="col-12">
                  <button id="clearDomainCacheBtn" class="btn btn-warning btn-sm w-100"></button>
                </div>
              </div>
              <button id="resetCacheStatsBtn" class="btn btn-secondary btn-sm w-100"></button>
            </div>
          </div>

          <!-- 缓存操作结果显示 -->
          <div id="cacheOperationResult" class="debug-result"></div>
        </div>
      </div>
      <!-- 域名匹配缓存管理卡片结束 -->

    </div>

    <div class="debug-section mt-4">
      <h4 id="liveLogsTitle" data-i18n="live_logs"></h4>
      <p class="text-muted" id="liveLogsDesc" data-i18n="live_logs_desc"></p>
      <div class="mb-3">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="filterInfo" value="info" checked>
          <label class="form-check-label" for="filterInfo" id="infoLabel" data-i18n="info"></label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="filterWarning" value="warning" checked>
          <label class="form-check-label" for="filterWarning" id="warningLabel" data-i18n="warning"></label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="filterError" value="error" checked>
          <label class="form-check-label" for="filterError" id="errorLabel" data-i18n="error"></label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="filterSuccess" value="success" checked>
          <label class="form-check-label" for="filterSuccess" id="successLabel" data-i18n="success"></label>
        </div>
      </div>
      <div id="logOutput" class="debug-result"></div>
      <button id="clearLogsBtn" class="btn btn-secondary btn-sm mt-2" data-i18n="clear_logs"></button>
    </div>

    <div class="debug-section mt-4">
      <h4 id="commonFixesTitle" data-i18n="common_fixes"></h4>
      <p class="text-muted" id="commonFixesDesc" data-i18n="common_fixes_desc"></p>
      <div class="list-group">
        <button id="fixPriorityBtn" class="list-group-item list-group-item-action">
          <strong id="fixPriorityTitle" data-i18n="fix_priority"></strong> <span id="fixPriorityDesc"
            data-i18n="fix_priority_desc"></span>
        </button>
        <button id="clearAllRulesBtn" class="list-group-item list-group-item-action">
          <strong id="clearReapplyTitle" data-i18n="clear_reapply"></strong> <span id="clearReapplyDesc"
            data-i18n="clear_reapply_desc"></span>
        </button>
      </div>
      <div id="fixResult" class="debug-result mt-3" data-i18n="select_fix_option"></div>
    </div>

    <div class="debug-section mt-4">
      <h4 id="diagnosticsTitle" data-i18n="diagnostics"></h4>
      <p class="text-muted" id="diagnosticsDesc" data-i18n="diagnostics_desc"></p>
      <button id="showDiagnosticsBtn" class="btn btn-info" data-i18n="show_diagnostics"></button>
      <div id="diagnosticsResult" class="debug-result" data-i18n="click_view_diagnostics"></div>
    </div>

    <!-- 自动切换功能控制 -->
    <div class="debug-section mt-4">
      <h4 id="autoSwitchTitle" data-i18n="auto_switch_feature"></h4>
      <p class="text-muted" id="autoSwitchDesc" data-i18n="auto_switch_desc"></p>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="autoSwitchToggle">
        <label class="form-check-label" for="autoSwitchToggle" id="enableAutoSwitchLabel"
          data-i18n="enable_auto_switch"></label>
      </div>
      <button id="showDomainRulesBtn" class="btn btn-outline-primary" data-i18n="show_domain_rules"></button>
      <div id="domainRulesResult" class="debug-result" data-i18n="click_view_domain_rules"></div>
    </div>
    <!-- 自动切换功能控制结束 -->
  </div>

  <script type="module" src="debug-ui.js"></script>
</body>

</html>
