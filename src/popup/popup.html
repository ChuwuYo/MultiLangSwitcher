<!DOCTYPE html>
<html>

<head>
  <!-- 基础页面配置 -->
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <!-- 字体预加载 -->
  <link rel="preload" href="../../assets/fonts/MapleMonoNL-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 样式表引入 -->
  <link href="../shared/vendor/bootstrap.purged.css" rel="stylesheet">
  <link href="../shared/page-base.css" rel="stylesheet">
  <link href="../shared/toggle.css" rel="stylesheet">
  <script src="../shared/theme-init.js"></script>
  <style>
    html {
      font-size: 0.875rem;
    }

    body {
      width: 380px;
      padding: 14px 12px 12px;
    }

    .header {
      margin-bottom: 14px;
      padding: 0 32px;
      text-align: center;
    }

    .header h4 {
      letter-spacing: -0.02em;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .language-select {
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-card {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--mls-border);
      border-radius: var(--mls-radius-md);
      background-color: var(--mls-surface-subtle);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section {
      margin-bottom: 12px;
    }

    .auto-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 6px 2px;
    }

    .auto-switch-label {
      font-size: 0.92em;
      cursor: pointer;
      user-select: none;
    }

    .popup-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--mls-border-subtle);
    }

    #statusText {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 当前语言代码徽章：作为弹窗唯一视觉焦点，保持克制的仪器读数感 */
    #currentLanguage {
      display: inline-block;
      background-color: var(--mls-accent-subtle);
      color: var(--mls-accent);
      border: 1px solid var(--mls-accent-border);
      padding: 2px 8px;
      border-radius: var(--mls-radius-sm);
      font-family: var(--mls-font-mono);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    #languageSelect {
      overflow-y: auto;
    }

    /* 切换开关 */
    .toggle-wrapper {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .toggle-checkbox {
      appearance: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .toggle-container {
      position: relative;
      width: 46px;
      height: 26px;
      border-radius: 999px;
      background-color: rgba(120, 120, 128, 0.24);
      transition: background-color 0.24s ease;
    }

    html[data-bs-theme="dark"] .toggle-container {
      background-color: rgba(120, 120, 128, 0.36);
    }

    .toggle-button {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18), 0 0.5px 1px rgba(0, 0, 0, 0.12);
      transition:
        transform 0.26s cubic-bezier(0.32, 1.25, 0.5, 1),
        width 0.16s ease;
    }

    .toggle-checkbox:active:not(:disabled) + .toggle-container > .toggle-button {
      width: 28px;
    }

    .toggle-checkbox:checked + .toggle-container {
      background-color: #34c759;
    }

    html[data-bs-theme="dark"] .toggle-checkbox:checked + .toggle-container {
      background-color: #30d158;
    }

    .toggle-checkbox:checked + .toggle-container > .toggle-button {
      transform: translateX(20px);
    }

    .toggle-checkbox:checked:active:not(:disabled) + .toggle-container > .toggle-button {
      transform: translateX(14px);
    }

    .toggle-checkbox:focus-visible + .toggle-container {
      outline: var(--mls-focus-outline);
      outline-offset: 2px;
    }

    .toggle-checkbox:disabled + .toggle-container {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #resetBtn {
      position: static;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      align-self: center;
      border-radius: var(--mls-radius-md);
    }

    /* 暗色模式下提升快捷工具栏描边按钮可读性 */
    html[data-bs-theme="dark"] #checkHeaderBtn {
      color: var(--mls-accent);
      border-color: var(--mls-accent-border);
    }

    html[data-bs-theme="dark"] #checkHeaderBtn:hover {
      background-color: var(--mls-accent-subtle);
      color: var(--mls-accent-hover);
    }

    html[data-bs-theme="dark"] #detectionPageLink,
    html[data-bs-theme="dark"] #debugPageLink {
      color: var(--bs-body-color);
      border-color: var(--mls-border);
    }

    /* 更新检查按钮：回归中性克制的页脚幽灵按钮 */
    .update-check-button {
      position: relative;
      font-size: 0.85em;
      border: 1px solid var(--mls-border);
      background-color: var(--mls-surface-subtle);
      color: var(--bs-secondary-color);
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      border-radius: var(--mls-radius-sm);
    }

    .update-check-button .spinner-border {
      width: 0.8rem;
      height: 0.8rem;
    }

    .update-check-button:hover:not(:disabled) {
      border-color: var(--mls-accent-border);
      background-color: var(--mls-accent-subtle);
      color: var(--mls-accent);
    }

    .update-check-button:focus-visible {
      outline: 2px solid var(--mls-accent);
      outline-offset: 2px;
    }

    /* 更新通知语义配色（统一令牌 + 区分 success 绿 / info 蓝 / warning 琥珀） */
    .update-notification {
      margin-top: 10px;
      padding: 12px;
      border-radius: var(--mls-radius-sm);
      font-size: 0.9em;
      border: 1px solid;
      animation: slideIn 0.25s ease-out;
    }

    .update-notification.success {
      background-color: var(--mls-success-subtle);
      border-color: var(--mls-success-border);
      color: var(--mls-success);
    }

    .update-notification.info {
      background-color: var(--mls-info-subtle);
      border-color: var(--mls-info-border);
      color: var(--mls-info);
    }

    .update-notification.warning {
      background-color: var(--mls-warning-subtle);
      border-color: var(--mls-warning-border);
      color: var(--mls-warning);
    }

    .update-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .update-actions .btn {
      font-size: 0.85em;
      padding: 5px 12px;
      border-radius: var(--mls-radius-sm);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .update-version-info {
      margin: 8px 0;
      font-size: 0.85em;
      line-height: 1.4;
    }

    .update-version-info strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1em;
    }

    .version-comparison {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .version-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .version-badge {
      background-color: var(--mls-surface-subtle);
      border: 1px solid var(--mls-border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--mls-font-mono);
      font-size: 0.9em;
    }

    .header-check-result {
      animation: slideIn 0.25s ease-out;
    }

    #headerCheckContent {
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #updateErrorMessage,
    #updateNotificationContent,
    #headerCheckContent {
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    #updateErrorMessage a,
    #updateNotificationContent a,
    #headerCheckContent a {
      word-break: break-all;
      display: inline-block;
      max-width: 100%;
    }

    #updateErrorAlert,
    #updateNotification .alert {
      max-width: 100%;
      overflow-wrap: break-word;
    }
  </style>
</head>

<body class="popup-body">
  <!-- 主题切换按钮 -->
  <button type="button" id="themeToggleBtn" class="toggle" data-i18n-title="theme_toggle" data-i18n-aria-label="theme_toggle"></button>

  <main class="container">
    <!-- 页面头部 -->
    <div class="header">
      <h4 id="extensionName" data-i18n="extension_name"></h4>
      <p class="text-muted mb-0" id="extensionSubtitle" data-i18n="subtitle"></p>
    </div>

    <!-- 状态行：当前语言状态卡 + 独立重置按钮 -->
    <div class="status-row">
      <!-- 当前状态卡：当前语言一目了然 -->
      <div class="status-card">
        <p id="statusText" class="mb-0" aria-live="polite"></p>
      </div>
      <!-- 重置Accept-Language按钮 -->
      <button type="button" id="resetBtn" class="toggle" data-i18n-title="reset_accept_language_tooltip" data-i18n-aria-label="reset_accept_language_tooltip"><img src="../../assets/images/reset.svg" id="resetBtnImg" width="16" height="16"
          class="invert-on-dark" data-i18n-alt="reset_accept_language_tooltip"></button>
    </div>

    <!-- 错误提示区域 -->
    <div id="errorAlert" class="alert alert-danger d-none mt-2" role="alert">
      <span id="errorMessage"></span>
    </div>

    <!-- 主操作区：语言选择 + 应用 -->
    <div class="section">
      <div class="language-select">
        <label for="languageSelect" class="form-label" id="languageSelectLabel" data-i18n="select_language"></label>
        <select class="form-select" id="languageSelect">
          <!-- 语言选项将由JavaScript动态生成 -->
        </select>
      </div>
      <button id="applyButton" class="btn btn-primary w-100" data-i18n="apply_changes"></button>
    </div>

    <!-- 自动切换：标签与精密机械开关同一行 -->
    <div class="auto-switch-row">
      <label for="autoSwitchToggle" id="autoSwitchLabel" class="auto-switch-label mb-0" data-i18n="auto_switch"></label>
      <div class="toggle-wrapper">
        <input class="toggle-checkbox" type="checkbox" role="switch" id="autoSwitchToggle">
        <div class="toggle-container" aria-hidden="true">
          <div class="toggle-button"></div>
        </div>
      </div>
    </div>

    <!-- 快捷工具区：语义一致的中性按钮 + 主强调给检查 -->
    <div class="section d-flex gap-2">
      <button type="button" id="checkHeaderBtn" class="btn btn-sm btn-outline-primary flex-fill" data-i18n="quick_check"></button>
      <a href="../detect/detect.html" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-secondary flex-fill" id="detectionPageLink" data-i18n="detection_page"></a>
      <a href="../debug/debug.html" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-secondary flex-fill" id="debugPageLink" data-i18n="debug_tools"></a>
    </div>

    <!-- 请求头检查结果显示区域 -->
    <div class="mt-2 d-none header-check-result" id="headerCheckResult">
      <div class="card">
        <div class="card-header bg-body-tertiary" id="headerCheckResultTitle" data-i18n="header_check_result"></div>
        <div class="card-body">
          <pre id="headerCheckContent" class="mb-0" aria-live="polite" data-i18n="click_quick_check"></pre>
        </div>
      </div>
    </div>

    <!-- 页脚：更新检查（次级、弱化） -->
    <div class="popup-footer">
      <button type="button" id="updateCheckBtn" class="btn btn-sm w-100 update-check-button">
        <span id="updateCheckText" data-i18n="check_for_updates"></span>
        <span id="updateCheckSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"
          aria-hidden="true"></span>
      </button>
    </div>

    <!-- 更新通知显示区域 -->
    <div id="updateNotification" class="mt-2 d-none" aria-live="polite">
      <div class="alert mb-0" role="alert">
        <div id="updateNotificationContent"></div>
      </div>
    </div>

    <!-- 更新错误显示区域 -->
    <div id="updateErrorAlert" class="alert alert-danger mt-2 d-none" role="alert">
      <span id="updateErrorMessage"></span>
    </div>
  </main>

  <!-- 主要功能脚本（ESM 入口） -->
  <script type="module" src="popup.js"></script>
</body>

</html>
