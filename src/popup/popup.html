<!DOCTYPE html>
<html>

<head>
  <!-- 基础页面配置 -->
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <!-- 字体预加载 -->
  <link rel="preload" href="../../fonts/MapleMonoNL-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 样式表引入 -->
  <link href="../../bootstrap.purged.css" rel="stylesheet">
  <link href="../shared/page-base.css" rel="stylesheet">
  <link href="../shared/toggle.css" rel="stylesheet">
  <script src="../shared/theme-init.js"></script>
  <style>
    /* 主体布局样式 */
    body {
      width: 380px;
      padding: 10px;
    }

    /* 头部区域样式 */
    .header {
      margin-bottom: 15px;
      text-align: center;
    }

    /* 语言选择区域样式 */
    .language-select {
      margin-bottom: 15px;
    }

    /* 状态行：状态卡 + 独立重置按钮 */
    .status-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* 状态卡：当前语言醒目展示 */
    .status-card {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--bs-border-color);
      border-radius: 8px;
      background-color: var(--bs-tertiary-bg);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 分区节奏 */
    .section {
      margin-bottom: 12px;
    }

    /* 自动切换行：标签与开关同行 */
    .auto-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 4px 2px;
    }

    /* 页脚：次级操作区 */
    .popup-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--bs-border-color-translucent);
    }

    /* 当前语言代码高亮样式 */
    #currentLanguage {
      background-color: #f4fccc;
      color: #0d6efd;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* 暗色主题下的语言代码高亮 */
    html[data-bs-theme="dark"] #currentLanguage {
      background-color: #373c42;
      color: #86b7fe;
    }

    /* 语言选择框的自定义滚动条样式 */
    #languageSelect {
      overflow-y: auto;
    }

    /* Webkit 浏览器滚动条样式 (Chrome, Safari, Edge) */
    #languageSelect::-webkit-scrollbar {
      width: 6px;
    }

    #languageSelect::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    #languageSelect::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 10px;
    }

    #languageSelect::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Firefox 浏览器滚动条样式 */
    #languageSelect {
      scrollbar-width: thin;
      /* "auto" 或 "thin" */
      scrollbar-color: #888 #f1f1f1;
      /* 滑块和轨道颜色 */
    }

    /* 切换开关CSS样式 */
    .toggle-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border-radius: .5em;
      padding: .125em;
      background-image: linear-gradient(to bottom, #d5d5d5, #e8e8e8);
      box-shadow: 0 1px 1px rgb(255 255 255 / .6);
      font-size: 1.5em;
      margin-top: 15px;
    }

    /* 切换开关复选框样式 */
    .toggle-checkbox {
      appearance: none;
      position: absolute;
      z-index: 1;
      border-radius: inherit;
      width: 100%;
      height: 100%;
      font: inherit;
      opacity: 0;
      cursor: pointer;
    }

    /* 切换开关容器样式 */
    .toggle-container {
      display: flex;
      align-items: center;
      position: relative;
      border-radius: .375em;
      width: 3em;
      height: 1.5em;
      background-color: #e8e8e8;
      box-shadow: inset 0 0 .0625em .125em rgb(255 255 255 / .2), inset 0 .0625em .125em rgb(0 0 0 / .4);
      transition: background-color .4s linear;
    }

    /* 切换开关选中状态样式 */
    .toggle-checkbox:checked+.toggle-container {
      background-color: #f3b519;
    }

    /* 切换开关按钮样式 */
    .toggle-button {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      left: .0625em;
      border-radius: .3125em;
      width: 1.375em;
      height: 1.375em;
      background-color: #e8e8e8;
      box-shadow: inset 0 -.0625em .0625em .125em rgb(0 0 0 / .1), inset 0 -.125em .0625em rgb(0 0 0 / .2), inset 0 .1875em .0625em rgb(255 255 255 / .3), 0 .125em .125em rgb(0 0 0 / .5);
      transition: left .4s;
    }

    /* 切换开关按钮选中位置 */
    .toggle-checkbox:checked+.toggle-container>.toggle-button {
      left: 1.5625em;
    }

    /* 切换开关按钮圆点容器 */
    .toggle-button-circles-container {
      display: grid;
      grid-template-columns: repeat(3, min-content);
      gap: .125em;
      position: absolute;
      margin: 0 auto;
    }

    /* 切换开关按钮圆点样式 */
    .toggle-button-circle {
      border-radius: 50%;
      width: .125em;
      height: .125em;
      background-image: radial-gradient(circle at 50% 0, #f5f5f5, #c4c4c4);
    }

    /* 重置按钮：状态卡右侧独立正方形按钮（边长跟卡片行高一致，icon 居中） */
    #resetBtn {
      position: static;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      align-self: center;
      border-radius: 8px;
    }

    /* 更新检查按钮基础样式 - 独特的淡紫色调 */
    .update-check-button {
      position: relative;
      font-size: 0.8em;
      border: 1px solid #e6e3f0;
      background-color: #f8f6fc;
      color: #7c6f9a;
      transition: all 0.2s ease;
      border-radius: 4px;
    }

    /* 更新检查按钮旋转器样式 */
    .update-check-button .spinner-border {
      width: 0.8rem;
      height: 0.8rem;
    }

    /* 更新检查按钮悬停效果 */
    .update-check-button:hover {
      border-color: #d4c8e8;
      background-color: #f0ebf8;
      color: #6b5b85;
      transform: translateY(-1px);
    }

    /* 更新检查按钮焦点状态 */
    .update-check-button:focus {
      box-shadow: 0 0 0 2px rgba(124, 111, 154, 0.25);
      outline: none;
      border-color: #d4c8e8;
    }

    /* 更新检查按钮激活状态 */
    .update-check-button:active {
      transform: translateY(0);
      background-color: #e8ddf4;
      border-color: #c7b8dd;
    }

    /* 暗色主题下的更新检查按钮 */
    html[data-bs-theme="dark"] .update-check-button {
      border-color: #4a4458;
      background-color: #2d2838;
      color: #b8a8d1;
    }

    html[data-bs-theme="dark"] .update-check-button:hover {
      border-color: #5d5470;
      background-color: #3a3447;
      color: #c9bce0;
    }

    html[data-bs-theme="dark"] .update-check-button:focus {
      box-shadow: 0 0 0 2px rgba(184, 168, 209, 0.25);
      border-color: #5d5470;
    }

    html[data-bs-theme="dark"] .update-check-button:active {
      background-color: #453f56;
      border-color: #6b6080;
    }

    /* 更新通知样式 */
    .update-notification {
      margin-top: 10px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9em;
      border: 1px solid;
    }

    /* 成功状态更新通知样式 */
    .update-notification.success {
      background-color: #d1edff;
      border-color: #0d6efd;
      color: #0d6efd;
    }

    /* 信息状态更新通知样式 */
    .update-notification.info {
      background-color: #e2f3ff;
      border-color: #0dcaf0;
      color: #055160;
    }

    /* 暗色主题下的更新通知样式 */
    html[data-bs-theme="dark"] .update-notification.success {
      background-color: #1e3a5f;
      border-color: #86b7fe;
      color: #86b7fe;
    }

    html[data-bs-theme="dark"] .update-notification.info {
      background-color: #1f4a54;
      border-color: #6edff6;
      color: #6edff6;
    }

    /* 更新操作按钮容器样式 */
    .update-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    /* 更新操作按钮样式 */
    .update-actions .btn {
      font-size: 0.8em;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 更新版本信息样式 */
    .update-version-info {
      margin: 8px 0;
      font-size: 0.85em;
      line-height: 1.4;
    }

    /* 更新版本信息标题样式 */
    .update-version-info strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1em;
    }

    /* 版本对比容器样式 */
    .version-comparison {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* 版本对比行样式 */
    .version-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 版本标签样式 */
    .version-badge {
      background-color: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'MapleMonoNL', monospace;
      font-size: 0.9em;
    }

    /* 通用滑入动画效果 - 可复用的动画类 */
    .slide-in-animation {
      animation: slideIn 0.3s ease-out;
    }

    /* 更新通知动画效果 - 复用通用动画 */
    .update-notification {
      animation: slideIn 0.3s ease-out;
    }

    /* 快速检查结果动画效果 - 复用通用动画 */
    .header-check-result {
      animation: slideIn 0.3s ease-out;
    }

    /* 滑入动画关键帧 */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 更新检查加载旋转器样式 */
    .update-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* 旋转动画关键帧 */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* 链接文本处理 - 防止长链接超出popup边界 */
    #updateErrorMessage,
    #updateNotificationContent,
    #headerCheckContent {
      word-break: break-all;
      overflow-wrap: break-word;
      max-width: 100%;
    }

    /* 链接样式优化 */
    #updateErrorMessage a,
    #updateNotificationContent a,
    #headerCheckContent a {
      word-break: break-all;
      display: inline-block;
      max-width: 100%;
    }

    /* 错误消息区域的特殊处理 */
    #updateErrorAlert {
      max-width: 100%;
      overflow-wrap: break-word;
    }

    /* 更新通知区域的特殊处理 */
    #updateNotification .alert {
      max-width: 100%;
      overflow-wrap: break-word;
    }

    /* 自动切换标签样式 */
    .auto-switch-label {
      font-size: 0.8em;
      display: block;
      margin-bottom: 5px;
    }

    /* 自动切换外层容器 */
    .toggle-wrapper-inline {
      font-size: 1em;
      width: fit-content;
    }

    /* 行内布局时清除开关自身的上边距与自动居中 */
    .auto-switch-row .toggle-wrapper {
      margin-top: 0;
    }
  </style>
</head>

<body class="popup-body">
  <!-- 主题切换按钮 -->
  <button id="themeToggleBtn" class="toggle" data-i18n-title="theme_toggle"></button>

  <div class="container">
    <!-- 页面头部 -->
    <div class="header">
      <h4 id="extensionName" data-i18n="extension_name"></h4>
      <p class="text-muted mb-0" id="extensionSubtitle" data-i18n="subtitle"></p>
    </div>

    <!-- 状态行：当前语言状态卡 + 独立重置按钮 -->
    <div class="status-row">
      <!-- 当前状态卡：当前语言一目了然 -->
      <div class="status-card">
        <p id="statusText" class="mb-0"></p>
      </div>
      <!-- 重置Accept-Language按钮 -->
      <button id="resetBtn" class="toggle" data-i18n-title="reset_accept_language_tooltip"><img src="../../images/reset.svg" id="resetBtnImg" width="16" height="16"
          class="invert-on-dark" data-i18n-alt="reset_accept_language_tooltip"></button>
    </div>

    <!-- 错误提示区域 -->
    <div id="errorAlert" class="alert alert-danger d-none mt-2" role="alert">
      <span id="errorMessage"></span>
    </div>

    <!-- 主操作区：语言选择 + 应用 -->
    <div class="section">
      <div class="language-select">
        <label for="languageSelect" class="form-label" id="languageSelectLabel" data-i18n="select_language"></label>
        <select class="form-select" id="languageSelect">
          <!-- 语言选项将由JavaScript动态生成 -->
        </select>
      </div>
      <button id="applyButton" class="btn btn-primary w-100" data-i18n="apply_changes"></button>
    </div>

    <!-- 自动切换：标签与开关同一行 -->
    <div class="auto-switch-row">
      <label for="autoSwitchToggle" id="autoSwitchLabel" class="auto-switch-label mb-0" data-i18n="auto_switch"></label>
      <div class="toggle-wrapper toggle-wrapper-inline">
        <input class="toggle-checkbox" type="checkbox" id="autoSwitchToggle">
        <div class="toggle-container">
          <div class="toggle-button">
            <div class="toggle-button-circles-container">
              <!-- 切换按钮装饰圆点 -->
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
              <div class="toggle-button-circle"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 快捷工具区：语义一致的中性按钮 + 主强调给检查 -->
    <div class="section d-flex gap-2">
      <button id="checkHeaderBtn" class="btn btn-sm btn-outline-primary flex-fill" data-i18n="quick_check"></button>
      <a href="../detect/detect.html" target="_blank" class="btn btn-sm btn-outline-secondary flex-fill" id="detectionPageLink" data-i18n="detection_page"></a>
      <a href="../debug/debug.html" target="_blank" class="btn btn-sm btn-outline-secondary flex-fill" id="debugPageLink" data-i18n="debug_tools"></a>
    </div>

    <!-- 请求头检查结果显示区域 -->
    <div class="mt-2 d-none header-check-result" id="headerCheckResult">
      <div class="card">
        <div class="card-header bg-light" id="headerCheckResultTitle" data-i18n="header_check_result"></div>
        <div class="card-body">
          <pre id="headerCheckContent" class="mb-0" style="font-size: 12px; max-height: 150px; overflow-y: auto;" data-i18n="click_quick_check"></pre>
        </div>
      </div>
    </div>

    <!-- 页脚：更新检查（次级、弱化） -->
    <div class="popup-footer">
      <button id="updateCheckBtn" class="btn btn-sm w-100 update-check-button">
        <span id="updateCheckText" data-i18n="check_for_updates"></span>
        <span id="updateCheckSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"
          aria-hidden="true"></span>
      </button>
    </div>

    <!-- 更新通知显示区域 -->
    <div id="updateNotification" class="mt-2 d-none">
      <div class="alert mb-0" role="alert">
        <div id="updateNotificationContent"></div>
      </div>
    </div>

    <!-- 更新错误显示区域 -->
    <div id="updateErrorAlert" class="alert alert-danger mt-2 d-none" role="alert">
      <span id="updateErrorMessage"></span>
    </div>
  </div>

  <!-- 主要功能脚本（ESM 入口） -->
  <script type="module" src="popup.js"></script>
</body>

</html>
