<!DOCTYPE html>
<html>

<head>
  <!-- 基础页面配置 -->
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <!-- 字体预加载 -->
  <link rel="preload" href="../../assets/fonts/MapleMonoNL-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 样式表引入 -->
  <link href="../shared/vendor/bootstrap.purged.css" rel="stylesheet">
  <link href="../shared/page-base.css" rel="stylesheet">
  <link href="../shared/toggle.css" rel="stylesheet">
  <link href="../shared/language-picker.css" rel="stylesheet">
  <script src="../shared/theme-init.js"></script>
  <style>
    html {
      font-size: 0.875rem;
    }

    body.popup-body {
      width: 380px;
      padding: 16px 16px 18px;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
    }

    body.popup-body main.container {
      padding: 0;
    }

    /* 顶栏右侧收拢两个无框幽灵图标按钮（覆盖 toggle.js 默认左/右分散定位） */
    body.popup-body .toggle {
      top: 14px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border-color: transparent;
      background-color: transparent;
      color: var(--bs-secondary-color);
    }

    body.popup-body #langToggleBtn {
      left: auto !important;
      right: 46px;
    }

    body.popup-body #themeToggleBtn {
      right: 14px;
    }

    body.popup-body .toggle:hover:not(:disabled) {
      border-color: transparent;
      background-color: var(--mls-surface-hover);
      color: var(--bs-body-color);
    }

    /* 左对齐单行工具顶栏，去掉居中大标题与冗余占位 */
    .header {
      margin-bottom: 14px;
      padding-right: 68px;
      text-align: left;
    }

    .header h4 {
      font-size: 1.08rem;
      letter-spacing: -0.025em;
      font-weight: 600;
      margin-bottom: 2px;
      color: var(--bs-body-color);
    }

    .header p {
      font-size: 0.84em;
      color: var(--bs-secondary-color) !important;
    }

    /* 当前语言读数行：排版立主视觉，不套冗余灰框卡片 */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 0 12px;
      border-top: 1px solid var(--mls-border-subtle);
      border-bottom: 1px solid var(--mls-border-subtle);
    }

    .status-card {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    #statusText {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.88em;
      color: var(--bs-secondary-color);
    }

    /* 当前语言读数：克制的等宽技术徽章（4px 利落圆角） */
    #currentLanguage {
      display: inline-block;
      background-color: var(--mls-accent-subtle);
      color: var(--mls-accent);
      border: 1px solid var(--mls-accent-border);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--mls-font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.05em;
      font-weight: 600;
      line-height: 1.3;
    }

    #resetBtn {
      position: static;
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      opacity: 0.72;
    }

    #resetBtn:hover:not(:disabled) {
      opacity: 1;
    }

    /* 核心操作区：语言选择器 + 紧贴文字的紧凑“应用”按钮同行排布 */
    .section {
      margin-bottom: 16px;
    }

    .language-select .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.84em;
      font-weight: 500;
      color: var(--bs-secondary-color);
    }

    .language-select {
      margin-bottom: 10px;
    }

    #applyButton {
      width: 100%;
      min-height: 38px;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 0.92em;
      font-weight: 500;
      white-space: nowrap;
      background-color: var(--mls-ink);
      border: 1px solid var(--mls-ink);
      color: var(--mls-ink-fg);
      transition: background-color 0.14s ease, opacity 0.14s ease, transform 0.1s ease;
    }

    #applyButton:hover:not(:disabled) {
      background-color: var(--mls-ink-hover);
      border-color: var(--mls-ink-hover);
      color: var(--mls-ink-fg);
    }

    #applyButton:active:not(:disabled) {
      transform: scale(0.98);
    }

    #applyButton:disabled {
      opacity: 0.35;
    }

    /* 自动切换行：发丝分割线 + 充裕垂直节奏 */
    .auto-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 14px 0;
      border-top: 1px solid var(--mls-border-subtle);
      border-bottom: 1px solid var(--mls-border-subtle);
    }

    .auto-switch-label {
      font-size: 0.92em;
      font-weight: 500;
      color: var(--bs-body-color);
      cursor: pointer;
      user-select: none;
    }

    /* 极简微弹开关 */
    .toggle-wrapper {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .toggle-checkbox {
      appearance: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .toggle-container {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background-color: rgba(120, 120, 128, 0.24);
      transition: background-color 0.22s ease;
    }

    html[data-bs-theme="dark"] .toggle-container {
      background-color: rgba(255, 255, 255, 0.18);
    }

    .toggle-button {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background-color: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      transition:
        transform 0.24s cubic-bezier(0.32, 1.25, 0.5, 1),
        width 0.16s ease;
    }

    .toggle-checkbox:active:not(:disabled) + .toggle-container > .toggle-button {
      width: 26px;
    }

    .toggle-checkbox:checked + .toggle-container {
      background-color: #22a055;
    }

    html[data-bs-theme="dark"] .toggle-checkbox:checked + .toggle-container {
      background-color: #2fb869;
    }

    .toggle-checkbox:checked + .toggle-container > .toggle-button {
      transform: translateX(20px);
    }

    .toggle-checkbox:checked:active:not(:disabled) + .toggle-container > .toggle-button {
      transform: translateX(14px);
    }

    .toggle-checkbox:focus-visible + .toggle-container {
      outline: var(--mls-focus-outline);
      outline-offset: 2px;
    }

    .toggle-checkbox:disabled + .toggle-container {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 快捷工具栏：三等分固定宽度网格，切换中英文长度不变 */
    .quick-tools-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick-tools-row .btn {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.86em;
      font-weight: 500;
      background-color: var(--mls-surface);
      border: 1px solid var(--mls-border);
      color: var(--bs-body-color);
      transition: border-color 0.14s ease, background-color 0.14s ease;
    }

    .quick-tools-row .btn:hover:not(:disabled) {
      border-color: var(--mls-border-strong);
      background-color: var(--mls-surface);
      color: var(--bs-body-color);
    }

    .quick-tools-row .btn:disabled {
      opacity: 0.5;
    }

    /* 页脚更新检查：退居最轻的无框文字操作 */
    .popup-footer {
      margin-top: 6px;
      padding-top: 2px;
    }

    .update-check-button {
      position: relative;
      min-height: 32px;
      padding: 5px 10px;
      font-size: 0.83em;
      font-weight: 500;
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--bs-secondary-color);
      border-radius: 6px;
      transition: background-color 0.14s ease, color 0.14s ease;
    }

    .update-check-button .spinner-border {
      width: 0.78rem;
      height: 0.78rem;
    }

    .update-check-button:hover:not(:disabled) {
      background-color: var(--mls-surface-hover);
      color: var(--bs-body-color);
    }

    .update-check-button:focus-visible {
      outline: var(--mls-focus-outline);
      outline-offset: 2px;
    }

    /* === 动态弹出组件统一视觉（请求头检查结果 / 错误提示 / 更新通知） === */
    .header-check-result {
      animation: slideIn 0.2s ease-out;
    }

    .header-check-result .card {
      border-radius: 6px;
      border: 1px solid var(--mls-border);
      background-color: var(--mls-surface);
      box-shadow: none;
    }

    .header-check-result .card-header {
      padding: 7px 10px;
      font-size: 0.82em;
      font-weight: 600;
      color: var(--bs-secondary-color);
      background-color: transparent !important;
      border-bottom: 1px solid var(--mls-border-subtle);
    }

    .header-check-result .card-body {
      padding: 9px 10px;
    }

    #headerCheckContent {
      font-size: 0.84rem;
      line-height: 1.45;
      max-height: 140px;
      overflow-y: auto;
      color: var(--bs-body-color);
    }

    /* 错误提示条（#errorAlert 与 #updateErrorAlert 统一精简） */
    #errorAlert,
    #updateErrorAlert {
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 0.85em;
      line-height: 1.45;
      background-color: var(--mls-danger-subtle);
      border: 1px solid var(--mls-danger-border);
      color: var(--mls-danger);
      max-width: 100%;
      overflow-wrap: break-word;
    }

    #errorAlert {
      margin-bottom: 12px;
    }

    /* 更新通知卡片（统一 6px 圆角、克制语义底色与按钮层级） */
    .update-notification {
      margin-top: 8px;
      padding: 11px 12px;
      border-radius: 6px;
      font-size: 0.86em;
      border: 1px solid var(--mls-border);
      animation: slideIn 0.2s ease-out;
    }

    .update-notification.success {
      background-color: var(--mls-success-subtle);
      border-color: var(--mls-success-border);
      color: var(--mls-success);
    }

    .update-notification.info {
      background-color: var(--mls-surface);
      border-color: var(--mls-border-strong);
      color: var(--bs-body-color);
    }

    .update-notification.warning {
      background-color: var(--mls-warning-subtle);
      border-color: var(--mls-warning-border);
      color: var(--mls-warning);
    }

    .update-version-info {
      margin: 2px 0 4px;
      font-size: 0.94em;
      line-height: 1.45;
    }

    .update-version-info strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1em;
      font-weight: 600;
    }

    .version-comparison {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .version-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .version-badge {
      background-color: var(--mls-surface-hover);
      border: 1px solid var(--mls-border);
      color: var(--bs-body-color);
      padding: 1px 7px;
      border-radius: 4px;
      font-family: var(--mls-font-mono);
      font-size: 0.88em;
    }

    .update-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .update-actions .btn {
      font-size: 0.86em;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .update-actions .btn-primary {
      background-color: var(--mls-ink);
      border-color: var(--mls-ink);
      color: var(--mls-ink-fg);
    }

    .update-actions .btn-primary:hover {
      background-color: var(--mls-ink-hover);
      border-color: var(--mls-ink-hover);
      color: var(--mls-ink-fg);
    }

    .update-actions .btn-outline-primary,
    .update-actions .btn-outline-warning {
      background-color: transparent;
      border-color: var(--mls-border-strong);
      color: var(--bs-body-color);
    }

    .update-actions .btn-outline-primary:hover,
    .update-actions .btn-outline-warning:hover {
      background-color: var(--mls-surface-hover);
      border-color: var(--mls-border-strong);
      color: var(--bs-body-color);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #updateErrorMessage,
    #updateNotificationContent,
    #headerCheckContent {
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    #updateErrorMessage a,
    #updateNotificationContent a,
    #headerCheckContent a {
      word-break: break-all;
      display: inline-block;
      max-width: 100%;
    }

    #updateNotification .alert {
      max-width: 100%;
      overflow-wrap: break-word;
    }

    /* 原地语言切换的轻量交叉淡化过渡（View Transitions API） */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 150ms;
      animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
  </style>
</head>

<body class="popup-body">
  <!-- 主题切换按钮 -->
  <button type="button" id="themeToggleBtn" class="toggle" data-i18n-title="theme_toggle" data-i18n-aria-label="theme_toggle"></button>

  <main class="container">
    <!-- 左对齐单行工具顶栏 -->
    <div class="header">
      <h4 id="extensionName" data-i18n="extension_name"></h4>
      <p class="text-muted mb-0" id="extensionSubtitle" data-i18n="subtitle"></p>
    </div>

    <!-- 当前语言读数行 + 独立重置图标 -->
    <div class="status-row">
      <div class="status-card">
        <p id="statusText" class="mb-0" aria-live="polite"></p>
      </div>
      <button type="button" id="resetBtn" class="toggle" data-i18n-title="reset_accept_language_tooltip" data-i18n-aria-label="reset_accept_language_tooltip"><img src="../../assets/images/reset.svg" id="resetBtnImg" width="15" height="15"
          class="invert-on-dark" data-i18n-alt="reset_accept_language_tooltip"></button>
    </div>

    <!-- 错误提示区域 -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert">
      <span id="errorMessage"></span>
    </div>

    <!-- 主操作区：等宽语言选择框 + 固定宽度应用按钮 -->
    <div class="section">
      <div class="language-select">
        <label for="languageSelect" class="form-label" id="languageSelectLabel" data-i18n="select_language"></label>
        <select class="form-select" id="languageSelect">
          <!-- 语言选项将由JavaScript动态生成 -->
        </select>
      </div>
      <button id="applyButton" class="btn btn-primary" data-i18n="apply_changes"></button>
    </div>

    <!-- 自动切换行 -->
    <div class="auto-switch-row">
      <label for="autoSwitchToggle" id="autoSwitchLabel" class="auto-switch-label mb-0" data-i18n="auto_switch"></label>
      <div class="toggle-wrapper">
        <input class="toggle-checkbox" type="checkbox" role="switch" id="autoSwitchToggle">
        <div class="toggle-container" aria-hidden="true">
          <div class="toggle-button"></div>
        </div>
      </div>
    </div>

    <!-- 快捷工具区 -->
    <div class="section quick-tools-row">
      <button type="button" id="checkHeaderBtn" class="btn btn-sm" data-i18n="quick_check"></button>
      <a href="../detect/detect.html" target="_blank" rel="noopener noreferrer" class="btn btn-sm" id="detectionPageLink" data-i18n="detection_page"></a>
      <a href="../debug/debug.html" target="_blank" rel="noopener noreferrer" class="btn btn-sm" id="debugPageLink" data-i18n="debug_tools"></a>
    </div>

    <!-- 请求头检查结果显示区域 -->
    <div class="mt-2 d-none header-check-result" id="headerCheckResult">
      <div class="card">
        <div class="card-header" id="headerCheckResultTitle" data-i18n="header_check_result"></div>
        <div class="card-body">
          <pre id="headerCheckContent" class="mb-0" aria-live="polite" data-i18n="click_quick_check"></pre>
        </div>
      </div>
    </div>

    <!-- 页脚：更新检查 -->
    <div class="popup-footer">
      <button type="button" id="updateCheckBtn" class="btn btn-sm w-100 update-check-button">
        <span id="updateCheckText" data-i18n="check_for_updates"></span>
        <span id="updateCheckSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"
          aria-hidden="true"></span>
      </button>
    </div>

    <!-- 更新通知显示区域 -->
    <div id="updateNotification" class="mt-2 d-none" aria-live="polite">
      <div class="alert mb-0" role="alert">
        <div id="updateNotificationContent"></div>
      </div>
    </div>

    <!-- 更新错误显示区域 -->
    <div id="updateErrorAlert" class="alert alert-danger mt-2 d-none" role="alert">
      <span id="updateErrorMessage"></span>
    </div>
  </main>

  <!-- 主要功能脚本（ESM 入口） -->
  <script type="module" src="popup.js"></script>
</body>

</html>
